<template id="finish-template">
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    #finish-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.38) 100%);
    }
    #finish-grain {
      position: absolute;
      inset: 0;
      opacity: 0.09;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }
  </style>
  <div id="root" data-composition-id="finish" data-width="1920" data-height="1080">
    <div id="finish-vignette"></div>
    <div id="finish-grain"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Film grain re-seated every 2 frames from a fixed hash: seek-safe, no CSS loop.
      for (let i = 0; i < 150; i++) {
        const hx = ((i * 7919) % 256) | 0;
        const hy = ((i * 104729) % 256) | 0;
        tl.set("#finish-grain", { backgroundPosition: hx + "px " + hy + "px" }, i / 15);
      }
      window.__timelines["finish"] = tl;
    })();
  </script>
</template>
