<template id="finish-template">
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    /* Darkness closing in around a single pool of light, as if the collage were lit by one candle. */
    #finish-dark {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 85% 52% at 50% 38%, rgba(0, 0, 0, 0) 34%, rgba(0, 0, 0, 0.5) 74%, rgba(0, 0, 0, 0.88) 100%);
    }
    #finish-vignette {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0) 8%, rgba(0, 0, 0, 0) 72%, rgba(0, 0, 0, 0.75));
    }
    #finish-grain {
      position: absolute;
      inset: 0;
      opacity: 0.14;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }
  </style>
  <div id="root" data-composition-id="finish" data-width="1080" data-height="1920">
    <div id="finish-dark" data-layout-allow-occlusion></div>
    <div id="finish-vignette" data-layout-allow-occlusion></div>
    <div id="finish-grain"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Seeded hash: the same "random" sequence on every render.
      function hash(i, k) {
        let x = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(k, 0xc2b2ae35);
        x ^= x >>> 13; x = Math.imul(x, 0x27d4eb2f); x ^= x >>> 16;
        return (x >>> 0) / 4294967296;
      }
      let level = 0.94;
      for (let i = 0; i < 150; i++) {
        // Film grain re-seated every 2 frames.
        tl.set("#finish-grain", { backgroundPosition: Math.floor(hash(i, 1) * 256) + "px " + Math.floor(hash(i, 2) * 256) + "px" }, i / 15);
        // Candle flicker: the darkness wavers by a few percent, smoothed so it never strobes.
        level = level * 0.6 + (0.86 + hash(i, 3) * 0.14) * 0.4;
        tl.set("#finish-dark", { opacity: level.toFixed(3) }, i / 15);
      }
      window.__timelines["finish"] = tl;
    })();
  </script>
</template>
