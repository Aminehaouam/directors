<template id="board-template">
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #263638;
    }
    #board-drift {
      position: absolute;
      inset: -60px;
    }
    #board-paper {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 38% 42%, rgba(120, 150, 150, 0.22), rgba(120, 150, 150, 0) 70%),
        radial-gradient(ellipse 50% 45% at 80% 78%, rgba(10, 20, 22, 0.35), rgba(10, 20, 22, 0) 70%),
        #263638;
    }
    #board-mottle,
    #board-fibre {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #board-mottle {
      opacity: 0.35;
      mix-blend-mode: soft-light;
    }
    #board-fibre {
      opacity: 0.18;
      mix-blend-mode: overlay;
    }
  </style>
  <div id="root" data-composition-id="board" data-width="1920" data-height="1080">
    <div id="board-drift" data-layout-allow-overflow>
      <div id="board-paper"></div>
      <svg id="board-mottle" aria-hidden="true">
        <filter id="board-f-mottle" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.004 0.006" numOctaves="3" seed="11" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#board-f-mottle)" />
      </svg>
      <svg id="board-fibre" aria-hidden="true">
        <filter id="board-f-fibre" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9 0.35" numOctaves="2" seed="4" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#board-f-fibre)" />
      </svg>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // The board drifts slowly under everything: constant speed, the world behind the cut-outs.
      tl.fromTo("#board-drift", { x: 0, y: 0 }, { x: -40, y: -18, duration: 10, ease: "none" }, 0);
      window.__timelines["board"] = tl;
    })();
  </script>
</template>
