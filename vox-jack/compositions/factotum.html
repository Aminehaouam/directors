  <style>

    #f-quote {

    #f-lines {

    /* Shakespeare: the Droeshout engraving from the First Folio, 1623. */
    #f-portrait {

    #f-portrait-cap {
      position: absolute;
      left: 20px;

      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #2e2922;
    }
    #f-name {
      left: 860px;
      top: 800px;
    }
    #f-name .f-tape {
      padding: 12px 32px 16px;
      font-size: 80px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
  </style>
  <div id="root" data-composition-id="factotum" data-width="1920" data-height="1080" data-layout-allow-overlap data-composition-variables='[{"id": "cite", "type": "string", "label": "Quote source", "default": "Greene’s Groats-worth of Witte, 1592"}, {"id": "meaning", "type": "string", "label": "Meaning label", "default": "a jack of all trades"}, {"id": "name", "type": "string", "label": "Name label", "default": "William Shakespeare"}]'>
    <div id="f-cam" data-layout-allow-overflow>
      <div id="f-punch" class="f-fill" data-layout-allow-overflow>
      <div id="f-trades">
        <div id="f-t1" class="f-abs f-trade" style="left:30px;top:24px"><div id="f-t1-b" class="f-fill"><div class="f-shadow"><div class="f-print"><img src="assets/img/trade-carpenter.jpg" alt="Carpenter, 1814" /></div></div></div></div>
        <div id="f-t2" class="f-abs f-trade" style="left:500px;top:-6px"><div id="f-t2-b" class="f-fill"><div class="f-shadow"><div class="f-print"><img src="assets/img/trade-blacksmith.jpg" alt="Blacksmith, 1814" /></div></div></div></div>
        <div id="f-t3" class="f-abs f-trade" style="left:968px;top:30px"><div id="f-t3-b" class="f-fill"><div class="f-shadow"><div class="f-print"><img src="assets/img/trade-cooper.jpg" alt="Cooper, 1814" /></div></div></div></div>
        <div id="f-t4" class="f-abs f-trade" style="left:1430px;top:8px"><div id="f-t4-b" class="f-fill"><div class="f-shadow"><div class="f-print"><img src="assets/img/trade-wheelwright.jpg" alt="Wheelwright, 1814" /></div></div></div></div>
        <div id="f-t5" class="f-abs f-trade" style="left:40px;top:712px"><div id="f-t5-b" class="f-fill"><div class="f-shadow"><div class="f-print"><img src="assets/img/trade-shoemaker.jpg" alt="Shoemaker, 1814" /></div></div></div></div>
        <div id="f-t6" class="f-abs f-trade" style="left:520px;top:740px"><div id="f-t6-b" class="f-fill"><div class="f-shadow"><div class="f-print"><img src="assets/img/trade-basketmaker.jpg" alt="Basket maker, 1814" /></div></div></div></div>
        <div id="f-t7" class="f-abs f-trade" style="left:990px;top:716px"><div id="f-t7-b" class="f-fill"><div class="f-shadow"><div class="f-print"><img src="assets/img/trade-cutler.jpg" alt="Cutler, 1814" /></div></div></div></div>
        <div id="f-t8" class="f-abs f-trade" style="left:1440px;top:730px"><div id="f-t8-b" class="f-fill"><div class="f-shadow"><div class="f-print"><img src="assets/img/trade-mason.jpg" alt="Mason, 1814" /></div></div></div></div>
      </div>
      <div id="f-dim"></div>

      <div id="f-quote" class="f-abs">
        <div id="f-quote-body" class="f-fill">

          </div>
          <div id="f-text">…being an <span class="f-mark" id="f-hl"><svg id="f-hl-svg" viewBox="0 0 100 40" preserveAspectRatio="none"><path id="f-hl-path" d="M 1 24 C 22 20.5, 47 25.5, 68 22.5 C 79 21, 90 23, 99 21.5" /></svg><span class="f-mark-word">absolute Iohannes fac totum</span></span>, is in his owne conceit the onely <span class="f-mark" id="f-sh"><span class="f-mark-word">Shake-scene</span><svg id="f-sh-svg" viewBox="0 0 100 40" preserveAspectRatio="none"><path id="f-sh-path" class="f-ink" d="M 22 7 C 58 1, 95 8, 97 20 C 99 31, 74 38, 44 37 C 16 36, 2 29, 3 19 C 4 10, 22 4, 52 4.5" /></svg></span> in a countrey.</div>
        </div>
      </div>

      <div id="f-cite" class="f-abs"><div id="f-cite-b" style="filter: drop-shadow(3px 5px 5px rgba(0,0,0,.4))"><div class="f-tape" data-var-text="cite">Greene’s Groats-worth of Witte, 1592</div></div></div>

        <div id="f-portrait-b" class="f-fill">

      <svg id="f-lines" viewBox="0 0 1920 1080" aria-hidden="true">
        <path id="f-line-jack" class="f-line" d="M 760 640 C 756 668, 748 690, 744 712" />
        <path id="f-line-sh" class="f-line" d="M 548 594 C 700 652, 920 642, 1092 560" />
      </svg>

      <div id="f-name" class="f-abs"><div id="f-name-b" style="filter: drop-shadow(6px 10px 10px rgba(0,0,0,.5))"><div class="f-tape" data-var-text="name">William Shakespeare</div></div></div>

  <script>
    (function () {
      function rng(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      document.querySelectorAll("#root .f-deckle").forEach(function (el) {
        const w = +el.dataset.w, h = +el.dataset.h, amp = +el.dataset.amp, r = rng(+el.dataset.seed);
        const pts = [], step = 14;
        for (let x = 0; x <= w; x += step) pts.push([x, r() * amp]);
        for (let y = 0; y <= h; y += step) pts.push([w - r() * amp, y]);
        for (let x = w; x >= 0; x -= step) pts.push([x, h - r() * amp]);
        for (let y = h; y >= 0; y -= step) pts.push([r() * amp, y]);
        el.style.clipPath = "polygon(" + pts.map(function (p) {
          return (p[0] / w * 100).toFixed(2) + "% " + (p[1] / h * 100).toFixed(2) + "%";
        }).join(",") + ")";
      });

      const tl = gsap.timeline({ paused: true });
      function draw(sel, at, dur) {
        const el = document.querySelector(sel);
        const len = el.getTotalLength();
        el.style.strokeDasharray = len + " " + (len + 8);
        tl.fromTo(sel, { strokeDashoffset: len + 4 }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at);
        // Hidden until its stroke starts, so the round cap never leaves a dot.
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
      }
      function slap(sel, at, rot) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
        tl.fromTo(sel, { scale: 1.16, rotation: rot + 4 }, { scale: 1, rotation: rot, duration: 0.13, ease: "steps(3)", immediateRender: false }, at);
      }

      // Scene clock starts at 3.4 s of the film; comments give film time. Cut to the score:
      // 120.5 BPM, beats at 0.07 + n x 0.4975 s, a break at 6.55-6.95 s, the drop at 7.00 s.
      const H = 3.4;
      const at = function (filmTime) { return filmTime - H; };
      // 3.45  the quote strip whips in on the 3.55 beat.
      tl.fromTo("#f-quote-body", { x: 2100, rotation: 3, scale: 1, y: 0 },
        { x: 0, rotation: -1.5, duration: 0.5, ease: "power4.out" }, at(3.45));
      // 4.05  phrase three, "...an absolute Johannes factotum": highlighter across the words.
      draw("#f-hl-path", at(4.05), 0.6);
      slap("#f-cite-b", at(4.03), -1);
      // 5.01  "...a jack of all trades": the trades of 1814 come down on sixteenth notes.
      const trades = [["#f-t1-b", -4], ["#f-t6-b", -3], ["#f-t3-b", -2], ["#f-t8-b", -4], ["#f-t2-b", 3], ["#f-t5-b", 3], ["#f-t4-b", 4], ["#f-t7-b", 2]];
      trades.forEach(function (t, i) { slap(t[0], at(5.01 + i * 0.1245), t[1]); });
      draw("#f-line-jack", at(5.9), 0.1);
      slap("#f-jack-b", at(6.0), -2);
      // 6.50  the break: the explanation clears, "Shake-scene" is circled, the quote moves down-left.
      tl.fromTo(["#f-jack", "#f-cite", "#f-line-jack"], { opacity: 1 },
        { opacity: 0, duration: 0.15, ease: "power2.in" }, at(6.5));
      tl.fromTo("#f-quote-body", { x: 0, y: 0, scale: 1 },
        { x: -280, y: 40, scale: 0.62, duration: 0.42, ease: "power3.inOut", immediateRender: false }, at(6.53));
      draw("#f-sh-path", at(6.56), 0.36);
      tl.fromTo("#f-dim", { opacity: 0 }, { opacity: 0.62, duration: 0.35, ease: "power2.inOut" }, at(6.53));
      tl.fromTo("#f-trades", { scale: 1, transformOrigin: "50% 50%" }, { scale: 0.96, duration: 0.42, ease: "power2.inOut" }, at(6.53));
      // 6.97  "...William Shakespeare": the portrait slams in one frame before the drop.
      tl.fromTo("#f-portrait-b", { x: 1300, rotation: 10, scale: 1.05 },
        { x: 0, rotation: 2.5, duration: 0.187, ease: "power2.in" }, at(6.78));
      tl.fromTo("#f-portrait-b", { scale: 1.05 }, { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, at(6.967));
      // The board jolts with the bass.
      const jolt = [[0, 9, 0.05], [9, -4, 0.08], [-4, 2, 0.08], [2, 0, 0.1]];
      let jt = at(6.967);
      jolt.forEach(function (j, i) {
        tl.fromTo("#f-punch", { y: j[0] }, { y: j[1], duration: j[2], ease: "sine.inOut", immediateRender: i === 0 }, jt);
        jt += j[2];
      });
      slap("#f-name-b", at(7.28), -2.5);
      draw("#f-line-sh", at(7.5), 0.3);
      // 8.96  punch in toward Shakespeare on the 8.99 accent, then hold to the end.
      tl.fromTo("#f-punch", { scale: 1, transformOrigin: "70% 60%" },
        { scale: 1.06, duration: 0.3, ease: "expo.out" }, at(8.96));
      // Slow push across the whole scene.
      tl.fromTo("#f-cam", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.03, duration: 6.6, ease: "none" }, 0);

      window.__timelines["factotum"] = tl;
    })();
  </script>
