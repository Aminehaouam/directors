<template id="factotum-template">
  <style>
    @font-face {
      font-family: "UnifrakturMaguntia";
      src: url("assets/fonts/UnifrakturMaguntia-Regular.woff2") format("woff2");
      font-weight: 400;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      --bone: #d6ccb8;
      --soot: #0d0c0b;
      --blood: #9a1f1a;
      --wash: #7a3a32;
      --print: #1a1512;
    }
    #f-cam {
      position: absolute;
      inset: 0;
    }
    .f-abs {
      position: absolute;
    }
    .f-fill {
      position: absolute;
      inset: 0;
    }
    .f-shadow {
      position: absolute;
      inset: 0;
      filter: drop-shadow(9px 16px 18px rgba(0, 0, 0, 0.8));
    }
    .f-char::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 40px 6px rgba(22, 12, 6, 0.85);
      pointer-events: none;
    }
    /* 1814 engravings of the trades, old prints with a soot-stained border. */
    .f-trade {
      width: 500px;
      height: 384px;
    }
    .f-print {
      position: absolute;
      inset: 0;
      background: #8f8778;
      padding: 12px;
    }
    .f-print img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #f-dim {
      position: absolute;
      inset: -60px;
      background: #050505;
      opacity: 0;
    }
    /* The quote strip. */
    #f-quote {
      left: 60px;
      top: 420px;
      width: 900px;
      height: 360px;
    }
    .f-strip {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 70% at 30% 35%, rgba(225, 214, 192, 0.45), rgba(225, 214, 192, 0) 70%),
        #bdb3a0;
    }
    #f-text {
      position: absolute;
      inset: 0;
      padding: 54px 40px 40px 66px;
      font-family: "EB Garamond", serif;
      font-weight: 500;
      font-size: 58px;
      line-height: 1.42;
      color: var(--print);
    }
    .f-mark {
      position: relative;
      display: inline-block;
      white-space: nowrap;
    }
    .f-mark-word {
      position: relative;
      z-index: 1;
    }
    .f-mark svg {
      position: absolute;
      overflow: visible;
    }
    #f-hl-svg {
      left: -2%;
      top: 18%;
      width: 104%;
      height: 74%;
      z-index: 0;
      mix-blend-mode: multiply;
    }
    #f-hl-path {
      fill: none;
      stroke: var(--wash);
      stroke-width: 30;
      stroke-linecap: butt;
      opacity: 0.42;
    }
    #f-sh-svg {
      left: -12%;
      top: -22%;
      width: 124%;
      height: 144%;
      z-index: 2;
    }
    .f-ink {
      fill: none;
      stroke: var(--blood);
      stroke-width: 3.4;
      stroke-linecap: round;
    }
    .f-tag {
      position: relative;
      white-space: nowrap;
      background: var(--soot);
      color: var(--bone);
      box-shadow: inset 0 0 0 2px rgba(214, 204, 184, 0.22);
      clip-path: polygon(0.8% 0%, 99.2% 3%, 100% 22%, 99% 41%, 100% 63%, 99.1% 82%, 99.6% 100%, 0.4% 97%, 1.2% 78%, 0% 58%, 1% 37%, 0.2% 18%);
    }
    #f-cite {
      left: 400px;
      top: 378px;
    }
    #f-cite .f-tag {
      padding: 6px 18px 8px;
      font-family: "EB Garamond", serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    #f-jack {
      left: 124px;
      top: 800px;
    }
    #f-jack .f-tag {
      padding: 6px 28px 14px;
      font-family: "UnifrakturMaguntia", serif;
      font-size: 58px;
      line-height: 1.15;
    }
    #f-jack-eq {
      color: #c23a2c;
      margin-right: 0.3em;
      font-family: "EB Garamond", serif;
    }
    #f-lines {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      overflow: visible;
    }
    .f-line {
      fill: none;
      stroke: var(--blood);
      stroke-width: 5;
      stroke-linecap: round;
    }
    /* Shakespeare: the Droeshout engraving from the First Folio, 1623. */
    #f-portrait {
      left: 240px;
      top: 520px;
      width: 600px;
      height: 640px;
    }
    #f-portrait .f-print {
      padding: 58px 18px 22px;
      background: #a39b8b;
    }
    .f-zoom-box {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #f-portrait-cap {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 12px;
      font-family: "EB Garamond", serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #17120f;
      white-space: nowrap;
    }
    #f-name {
      left: 136px;
      top: 1010px;
    }
    #f-name .f-tag {
      padding: 4px 38px 22px;
      font-family: "UnifrakturMaguntia", serif;
      font-size: 100px;
      line-height: 1.02;
      text-align: left;
    }
