  <div id="root" data-composition-id="greene" data-width="1920" data-height="1080" data-composition-variables='[{"id": "year", "type": "string", "label": "Year", "default": "1592"}, {"id": "who", "type": "string", "label": "Who label", "default": "Robert Greene, playwright"}, {"id": "who-note", "type": "string", "label": "Who note", "default": "Written on his deathbed"}]'>
    <div id="g-cam" data-layout-allow-overflow>

  <script>
    (function () {
      // Seeded torn-paper edges for the cut-outs (fixed sizes, so no layout read).
      function rng(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      document.querySelectorAll("#root .g-deckle").forEach(function (el) {
        const w = +el.dataset.w, h = +el.dataset.h, amp = +el.dataset.amp, r = rng(+el.dataset.seed);
        const pts = [], step = 14;
        for (let x = 0; x <= w; x += step) pts.push([x, r() * amp]);
        for (let y = 0; y <= h; y += step) pts.push([w - r() * amp, y]);
        for (let x = w; x >= 0; x -= step) pts.push([x, h - r() * amp]);
        for (let y = h; y >= 0; y -= step) pts.push([r() * amp, y]);
        el.style.clipPath = "polygon(" + pts.map(function (p) {
          return (p[0] / w * 100).toFixed(2) + "% " + (p[1] / h * 100).toFixed(2) + "%";
        }).join(",") + ")";
      });
      // Hand-drawn loop (same wobble as the registry marker-highlight circle), stretched into a box.
      const LOOP = [[22, 7], [58, 1, 95, 8, 97, 20], [99, 31, 74, 38, 44, 37], [16, 36, 2, 29, 3, 19], [4, 10, 22, 4, 52, 4.5]];
      document.querySelectorAll("#root [data-box]").forEach(function (p) {
        const b = p.dataset.box.split(" ").map(Number);
        const X = function (v) { return (b[0] + v / 100 * b[2]).toFixed(1); };
        const Y = function (v) { return (b[1] + v / 40 * b[3]).toFixed(1); };
        let d = "M " + X(LOOP[0][0]) + " " + Y(LOOP[0][1]);
        for (let i = 1; i < LOOP.length; i++) {
          const c = LOOP[i];
          d += " C " + X(c[0]) + " " + Y(c[1]) + ", " + X(c[2]) + " " + Y(c[3]) + ", " + X(c[4]) + " " + Y(c[5]);
        }
        p.setAttribute("d", d);
      });

      const tl = gsap.timeline({ paused: true });
      // Ink reveals by measured dash length, both endpoints explicit, so seeks never leave stale paint.
      function draw(sel, at, dur) {
        const el = document.querySelector(sel);
        const len = el.getTotalLength();
        el.style.strokeDasharray = len + " " + (len + 8);
        tl.fromTo(sel, { strokeDashoffset: len + 4 }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, at);
        // Hidden until its stroke starts, so the round cap never leaves a dot.
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
      }
      // A paper piece slapped down on twos: one frame to appear, settles in three steps.
      function slap(sel, at, rot) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
        tl.fromTo(sel, { scale: 1.16, rotation: rot + 4 }, { scale: 1, rotation: rot, duration: 0.13, ease: "steps(3)", immediateRender: false }, at);
      }

      // 0.00  "In 1592..." the title page slides up onto the board.
      tl.fromTo("#g-page-body", { y: 820, x: -60, rotation: -9 }, { y: 0, x: 0, rotation: -2.5, duration: 0.8, ease: "expo.out" }, 0);
      // 0.70  the printed date is circled, a line runs out to a big 1592.
      draw("#g-circ-date", 0.7, 0.45);
      draw("#g-line-date", 0.98, 0.32);
      slap("#g-date-body", 1.22, 3);
      // 1.70  "...a dying playwright": the deathbed line is circled and labelled.
      draw("#g-circ-death", 1.7, 0.5);
      draw("#g-line-death", 2.02, 0.3);
      slap("#g-label-body", 2.27, -1.5);
      slap("#g-sub-body", 2.45, 1.2);
      // Slow push on the whole collage while it holds.
      tl.fromTo("#g-cam", { scale: 1, transformOrigin: "42% 50%" }, { scale: 1.035, duration: 3.2, ease: "none" }, 0);
      // 3.20  whip off to the left, the quote arrives from the right.
      tl.fromTo("#g-cam", { x: 0 }, { x: -2200, duration: 0.32, ease: "power3.in" }, 3.2);

      window.__timelines["greene"] = tl;
    })();
  </script>
